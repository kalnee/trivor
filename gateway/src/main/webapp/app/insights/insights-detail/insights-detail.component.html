<div class="container-fluid p-2">
    <div class="row">
        <div class="col-md-2">
            <div class="row">
                <div class="col-md-12">
                    <img [src]="transcript.coverUrl" class="img-responsive pl-2 img-thumbnail" alt="cover">
                </div>
            </div>
            <div class="row margin-top-s">
                <div class="col-md-12">
                    <ul class="list-group">
                        <li class="list-group-item active">Summary</li>
                        <li class="list-group-item">Nouns</li>
                        <li class="list-group-item">Verbs</li>
                        <li class="list-group-item">Adverbs</li>
                        <li class="list-group-item">Adjectives</li>
                        <li class="list-group-item">Frequent Sentences</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <h2>{{transcript.name}}
                <small class="text-muted">({{transcript.year}})</small>
            </h2>
            <p>
                <span class="badge badge-primary float-left">{{transcript.type}}</span>
                <span class="badge badge-success float-left ml-1">{{transcript.genres}}</span>
                <span class="badge badge-info float-left ml-1">{{transcript.country}}</span>
            </p>

            <div class="row">
                <div class="col-md-12">
                    <img class="margin-top-l" src="http://data-ink.com/wp-content/uploads/2012/06/info_a.jpg" alt="">
                </div>
            </div>
        </div>
    </div>
</div>
