<div class="container-fluid p-2">
    <div class="row">
        <div class="col-md-12">
            <h2>Insights</h2>
            <hr>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-md-2">
            <ul class="list-group">
                <li class="list-group-item active">All</li>
                <li class="list-group-item">Movies</li>
                <li class="list-group-item">TV Shows</li>
                <li class="list-group-item">Transcripts</li>
            </ul>
        </div>
        <div class="col-md-10">
            <div class="row justify-content-center">
                <div class="col-md-5 mb-3">
                    <input type="text"
                           placeholder="Find movies, tv shows and transcripts..."
                           class="form-control input-lg"/>
                </div>
            </div>
            <div class="row justify-content-center">
                <jhi-transcript-card *ngFor="let transcript of transcripts" [transcript]="transcript"></jhi-transcript-card>
            </div>
        </div>
    </div>
</div>
